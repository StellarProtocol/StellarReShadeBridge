name: publish
# Build the add-on (same steps as build.yml) on a version tag, then attach it to a GitHub release.
# The CDN copy is made by the plugin registry's publish-dependency workflow (it holds the CDN keys).
#
# build  : runs on tag push — compile + validate.
# release: creates the GitHub release v<version> with the add-on + LICENSE (no secrets).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: ReShade 6.8.0 add-on headers
        run: git clone --depth 1 --branch v6.8.0 https://github.com/crosire/reshade.git rs
      - name: Build
        run: cl /nologo /LD /std:c++17 /EHsc /O2 /DNDEBUG /I rs\include src\bridge.cpp /Fe:Stellar.ReShadeBridge.addon64 /link user32.lib
      - uses: actions/upload-artifact@v4
        with:
          name: Stellar.ReShadeBridge.addon64
          path: Stellar.ReShadeBridge.addon64
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release; no CDN keys here — the plugin registry's publish-dependency
                        # workflow copies the release asset to the CDN behind its Production gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Stellar.ReShadeBridge.addon64

      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$GITHUB_REF_NAME' must look like vX.Y.Z"; exit 1; }

      - name: Create the release (assets are immutable per tag)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(sha256sum Stellar.ReShadeBridge.addon64 | cut -d' ' -f1)
          SIZE=$(stat -c%s Stellar.ReShadeBridge.addon64)
          gh release create "$GITHUB_REF_NAME" Stellar.ReShadeBridge.addon64 LICENSE \
            --title "$GITHUB_REF_NAME" --notes "Stellar ReShade bridge add-on for ReShade 6.8.0 (64-bit). sha256 \`$SHA\`, $SIZE bytes."
          {
            echo "### Stellar.ReShadeBridge.addon64"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| sha256 | \`$SHA\` |"
            echo "| size (bytes) | $SIZE |"
          } >> "$GITHUB_STEP_SUMMARY"
