name: publish-reshade
# Mirror a specific ReShade release's add-on-capable DLL + license to the public `stellar` MinIO
# bucket, so the bridge's consumers don't depend on reshade.me at install time.
#
# Manually triggered: the caller supplies the ReShade version and the sha256 of its official
# "Addon" installer (from https://reshade.me/#download, "ReShade with full add-on support"); the
# workflow refuses to proceed if the downloaded installer doesn't match.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "ReShade version to mirror, e.g. 6.8.0"
        required: true
        default: "6.8.0"
      sha256:
        description: "sha256 of the official ReShade_Setup_<version>_Addon.exe installer"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Required reviewers on this environment = the real-device smoke gate.
    environment: Production
    env:
      # Cloudflare R2: writes go to s3://$BUCKET via $S3_ENDPOINT; public reads come from the
      # custom domain bound to the bucket root.
      S3_ENDPOINT: https://757f61fd2bda67f9a3bc7c3b9b8d62e1.r2.cloudflarestorage.com
      BUCKET: cdn
    steps:
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          SHA256: ${{ inputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$VERSION' must look like X.Y.Z"
            exit 1
          fi
          if ! [[ "$SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::sha256 must be 64 hex characters"
            exit 1
          fi

      - name: Download ReShade installer
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o ReShade_Setup_Addon.exe "https://reshade.me/downloads/ReShade_Setup_${VERSION}_Addon.exe"

      - name: Verify installer sha256
        env:
          SHA256: ${{ inputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL=$(sha256sum ReShade_Setup_Addon.exe | cut -d' ' -f1)
          EXPECTED=$(printf '%s' "$SHA256" | tr '[:upper:]' '[:lower:]')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::installer sha256 mismatch: expected $EXPECTED, got $ACTUAL"
            exit 1
          fi
          echo "installer sha256 verified: $ACTUAL"

      - name: Extract ReShade64.dll
        shell: bash
        run: |
          set -euo pipefail
          7z e ReShade_Setup_Addon.exe ReShade64.dll
          test -f ReShade64.dll

      - name: Fetch ReShade license
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o LICENSE.txt "https://raw.githubusercontent.com/crosire/reshade/v${VERSION}/LICENSE.md"

      - name: Publish ReShade64.dll + license to MinIO
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
          # MinIO rejects AWS CLI v2 default multipart checksums — opt out.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          KEY="deps/reshade/$VERSION"
          aws s3 cp ReShade64.dll "s3://$BUCKET/$KEY/ReShade64.dll" --endpoint-url "$S3_ENDPOINT"
          aws s3 cp LICENSE.txt "s3://$BUCKET/$KEY/LICENSE.txt" --endpoint-url "$S3_ENDPOINT"

      - name: Record sha256 + size in job summary
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(sha256sum ReShade64.dll | cut -d' ' -f1)
          SIZE=$(stat -c%s ReShade64.dll)
          {
            echo "### ReShade64.dll"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| sha256 | \`$SHA\` |"
            echo "| size (bytes) | $SIZE |"
          } >> "$GITHUB_STEP_SUMMARY"
